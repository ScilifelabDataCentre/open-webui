name: Create and publish manual Docker image with branch-date tag

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-branch-date-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set repository and image name to lowercase
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>"${GITHUB_ENV}"
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >>"${GITHUB_ENV}"
        env:
          IMAGE_NAME: "${{ github.repository }}"

      - name: Compute branch-date image tag
        run: |
          BRANCH_NAME="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
          CREATION_DATE="$(date -u +%Y%m%d)"
          echo "IMAGE_TAG=${BRANCH_NAME}-${CREATION_DATE}" >>"${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sbom: true
          build-args: |
            BUILD_HASH=${{ github.sha }}

      - name: Show published image
        run: echo "${FULL_IMAGE_NAME}:${IMAGE_TAG}"
